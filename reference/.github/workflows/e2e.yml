# @prose
# # End-to-end tests
#
# Runs a repository's browser checks, `pnpm run test:e2e`, after each merge to `main`. It's a
# workflow beside `ci.yml`, so `ci` stays the same in every repository and finishes first. The
# `main` ruleset doesn't require it. `craftz status` and `pnpm gone` say how the latest run ended,
# and a failed run keeps its Playwright report for a week, to open the trace.
#
# It runs once for each merge, since on a pull request it finished after the merge and gated
# nothing, and every push and branch update ran it again. A merge that changes only Markdown,
# unit tests or their fixtures skips it, since a browser can't see those change. `workflow_dispatch`
# runs it by hand,
# on a branch too, where a risky change needs a browser run before it merges. A run is never
# cancelled by a later merge, since a cancelled run says nothing about its commit.
#
# A job that runs past six minutes is stopped, where GitHub's own limit is six hours. That's for a
# job that hangs. The `test:e2e` step is stopped at four minutes, twice its target, so a suite
# that has slowed that far fails and gets fixed. One over the target but under the stop passes, and
# `craftz status` notes it, as [the rules](https://craftz.amitkaps.com/docs/rules.md#ci) say.
name: E2E

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - tests/unit/**
      - tests/fixtures/**
  workflow_dispatch:

# Each commit has its own run, and a later merge doesn't cancel it.
concurrency:
  group: ${{ github.workflow }}-${{ github.sha }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      # Reads the pnpm version from package.json's `packageManager`.
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile
      # The headless shell is all a headless run needs, and it's far smaller than full Chromium.
      # It launches on `ubuntu-latest` as it is, since `playwright install-deps chromium` only adds
      # fonts there, and its `apt` step hung for six minutes in a run. Five seconds is the usual
      # download, so a minute is for a download that has hung.
      - name: Chromium
        timeout-minutes: 1
        run: pnpm exec playwright install --only-shell chromium

      - name: test:e2e
        timeout-minutes: 4
        run: pnpm run test:e2e

      - name: Report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report
          if-no-files-found: ignore
          retention-days: 7
