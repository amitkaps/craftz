# @prose
# # pnpm's settings
#
# pnpm 12 reads project settings from here, not from `.npmrc` or `package.json`. It's a
# settings file, not a workspace. craftz writes it, the same in every repository, so a change
# here is a change to [the rules](https://craftz.amitkaps.com/docs/rules.md).

# @prose
# pnpm holds back a version for 12 hours after it's published, so a bad release can be caught
# before it's installed. pnpm's default is a day, which held a toolchain move a day for no
# gain. Our own packages skip the wait, since each reaches npm only after the owner approves
# it with 2FA. The scope, not a version, is named, so a release needs no change here.
minimumReleaseAge: 720
minimumReleaseAgeExclude:
  - "@amitkaps/*"

# @prose
# Dependencies allowed to run install scripts. Both are native binaries: esbuild for the
# build, and workerd for the local Cloudflare runtime.
allowBuilds:
  esbuild: true
  workerd: true

# @prose
# Vite+ ships its own build of Vite, and every `vite` in the tree is pointed at it, at the
# version of the `vite-plus` devDependency, so the two move together. Since that build is an
# npm alias, pnpm can't check it against the usual `vite` peer ranges, so those checks
# are off for `vite`.
overrides:
  "vite@*": "npm:@voidzero-dev/vite-plus-core@1.3.0"

peerDependencyRules:
  allowAny:
    - vite
