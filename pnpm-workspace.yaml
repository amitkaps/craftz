# @prose
# # pnpm's settings
#
# pnpm 12 reads project settings from here, not from `.npmrc` or `package.json`. It's a
# settings file, not a workspace. craftz writes it, the same in every repository, so a change
# here is a change to [the rules](https://craftz.amitkaps.com/docs/rules.md).

# @prose
# pnpm holds back a version for a day after it's published, so a hijacked release can be
# pulled before it's installed. Our own packages skip the wait.
#
# The risk is in the hundreds of libraries and nested packages that move without anyone reading
# them, and a hijack is usually caught within hours. Any wait of hours covers that, so pnpm's
# default is kept rather than a number of our own. Our own skip it, since each reaches npm only
# after the owner approves it with 2FA. The scope, not a version, is named, so a release needs
# no change here.
minimumReleaseAgeExclude:
  - "@amitkaps/*"

# @prose
# Dependencies allowed to run install scripts. Both are native binaries: esbuild for the
# build, and workerd for the local Cloudflare runtime, where an app installs wrangler.
allowBuilds:
  esbuild: true
  workerd: true

# @prose
# Vite+ ships its own build of Vite, and every `vite` in the tree is pointed at it, at the
# version of the `vite-plus` devDependency, so the two move together. Since that build is an
# npm alias, pnpm can't check it against the usual `vite` peer ranges, so those checks
# are off for `vite`.
overrides:
  "vite@*": "npm:@voidzero-dev/vite-plus-core@1.4.0"

peerDependencyRules:
  allowAny:
    - vite
