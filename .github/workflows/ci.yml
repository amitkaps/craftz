# @prose
# # CI
#
# Checks every pull request and every push to `main` with `pnpm run verify`, the script a
# site's deploy and a package's release run first too. It doesn't deploy or release, and it's
# the same in every repository, so what a repository adds goes in `verify`. The job is named
# `ci`, the check that branch protection requires.
#
# A job that runs past ten minutes is stopped, where GitHub's own limit is six hours. That's for
# a job that hangs. A slow `verify` passes, and `craftz status` notes it, as
# [the rules](https://craftz.amitkaps.com/docs/rules.md#ci) say.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A new push cancels the run before it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      # Reads the pnpm version from package.json's `packageManager`.
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Verify
        run: pnpm run verify
