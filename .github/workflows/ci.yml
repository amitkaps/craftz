# @prose
# # CI
#
# Checks every pull request with `pnpm run verify`, the script a site's deploy and a package's
# release run first too. The job is named `ci`, the check that branch protection requires.
#
# It doesn't run again on a push to `main`. The ruleset needs the branch up to date, so the merge
# is the tree this run checked, and the deploy or the release runs `verify` on it again. It
# doesn't deploy or release, and it's the same in every repository, so what a repository adds
# goes in `verify`.
#
# The job and its `verify` step each have a time limit, where GitHub's own is six hours. A limit
# guards against a hang, and it isn't `verify`'s target.
# [The rules](https://craftz.amitkaps.com/docs/rules.md#ci) state both. A `verify` over the target
# but under the limit passes, and `craftz status` notes it.
#
# On a pull request, `prose style` also gives its advice on the files the pull request changed,
# shown beside their lines. An agent that opens one without `pnpm pr` sees it there. It's advice,
# so it never fails. It runs after `verify`, since prose's own `prose` is the build `verify`
# writes, and it runs when `verify` fails too.
name: CI

on:
  pull_request:
    branches: [main]

# A new push cancels the run before it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        # A pull request's checkout is a merge commit, so its first parent is `main`.
        with:
          fetch-depth: 2
      # Reads the pnpm version from package.json's `packageManager`.
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Vite+'s task cache, so a `test` or `build` whose files are unchanged replays, and Vitest's
      # own, keyed by content, so a test run that misses doesn't transform every module again.
      # The key is new each run and restores the latest, since a cache can't be overwritten.
      - name: Task cache
        uses: actions/cache@v6
        with:
          path: |
            node_modules/.vite/task-cache
            node_modules/.vite/vitest
          key: vp-task-${{ runner.os }}-${{ runner.arch }}-${{ github.run_id }}
          restore-keys: vp-task-${{ runner.os }}-${{ runner.arch }}-

      - name: Verify
        timeout-minutes: 4
        run: pnpm run verify

      - name: Style
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        run: pnpm prose style --since HEAD^1
